
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Industrial Equipment Intelligence{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Navigation Bar -->
    
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'dashboard' %}">
            Industrial Equipment Intelligence
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard' %}">
                        Overview
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'new_prediction' %}">
                        New Prediction
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'prediction_history' %}">
                        Prediction History
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'rul_chart' %}">
                        RUL Chart
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>


    <!-- Main Content -->
    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
